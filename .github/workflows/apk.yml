name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Aktuelle Web-App als Offline-Version einbauen
        run: cp web/index.html android/app/src/main/assets/www/index.html
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          ./gradlew assembleDebug --no-daemon -PwebUrl="https://$OWNER.github.io/$REPO/"
          cp app/build/outputs/apk/debug/app-debug.apk ../KlavierTrainer.apk
      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app KlavierTrainer.apk --title "Klavier Trainer – App zum Installieren" --notes "Diese APK einmal auf dem Handy herunterladen und installieren. Änderungen an der App-Oberfläche kommen danach automatisch beim Öffnen der App."
